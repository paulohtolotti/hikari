[project]
name = "hikari"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

authors = [
    { name = "paulohtolotti", email = "paulohtolotti@alumni.usp.br" }
]

requires-python = ">=3.14"

dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.2",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pyright]
include = ["app"]
exclude = [".venv", "**/__pycache__", "alembic/**"]
reportMissingImports = "error"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"